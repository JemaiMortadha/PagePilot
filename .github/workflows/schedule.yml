name: PagePilot Scheduled Run

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Runs at 00:00, 06:00, 12:00, and 18:00 UTC every day
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt
          
      - name: Restore cache (Seen posts and usage stats)
        uses: actions/cache@v3
        with:
          path: |
            seen_posts.json
            usage_stats.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-
            
      - name: Run Initial Setup
        run: python setup.py
        
      - name: Run PagePilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          COMPETITOR_PAGES: ${{ secrets.COMPETITOR_PAGES }}
          PAGE_NAME: ${{ secrets.PAGE_NAME }}
          POSTS_TO_CHECK: "1"
          DEDUP_HOURS: "72"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py --once
        
      - name: Save state cache (Seen posts and usage stats)
        if: always()
        uses: actions/cache/save@v3
        with:
          path: |
            seen_posts.json
            usage_stats.json
          key: state-${{ github.run_id }}
