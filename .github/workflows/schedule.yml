name: PagePilot Scheduled Run

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Runs at 00:23, 06:23, 12:23, and 18:23 UTC every day
    - cron: '23 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Give the job permission to commit back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token that allows pushing back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt

      - name: Run Initial Setup
        run: python setup.py

      - name: Run PagePilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          COMPETITOR_PAGES: ${{ secrets.COMPETITOR_PAGES }}
          PAGE_NAME: ${{ secrets.PAGE_NAME }}
          POSTS_TO_CHECK: "1"
          DEDUP_HOURS: "72"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py --once

      - name: Commit updated state back to repo
        if: always()
        run: |
          git config user.name "PagePilot Bot"
          git config user.email "pagepilot-bot@users.noreply.github.com"
          git add seen_posts.json usage_stats.json
          # Only commit if there are actual changes (avoids empty commits)
          git diff --staged --quiet || git commit -m "chore: update seen_posts and usage_stats [skip ci]"
          git push
